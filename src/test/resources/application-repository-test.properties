spring.datasource.url=${LEDGER_TEST_DB_URL:jdbc:postgresql://localhost:5432/ledger_test}
spring.datasource.username=${LEDGER_TEST_DB_USERNAME}
spring.datasource.password=${LEDGER_TEST_DB_PASSWORD}
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
